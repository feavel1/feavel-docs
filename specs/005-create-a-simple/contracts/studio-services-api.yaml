openapi: 3.0.3
info:
  title: Studio Services Dashboard API
  description: API endpoints for the studio services dashboard feature
  version: 1.0.0

servers:
  - url: https://your-domain.com
    description: Production server

paths:
  /studios/dashboard/services:
    get:
      summary: Get studio services for dashboard display
      description: Retrieve all services created by the authenticated studio for display in the dashboard
      operationId: getStudioServices
      parameters:
        - name: page
          in: query
          description: Page number for pagination
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Number of services per page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 9
        - name: search
          in: query
          description: Search term to filter services by name
          required: false
          schema:
            type: string
        - name: categories
          in: query
          description: Comma-separated list of category names to filter by
          required: false
          schema:
            type: string
        - name: sort
          in: query
          description: Sort order for services
          required: false
          schema:
            type: string
            enum: [newest, price_low, price_high]
            default: newest
      responses:
        '200':
          description: Successful response with studio services
          content:
            application/json:
              schema:
                type: object
                properties:
                  services:
                    type: array
                    items:
                      $ref: '#/components/schemas/Service'
                  totalCount:
                    type: integer
                    description: Total number of services matching criteria
                  currentPage:
                    type: integer
                    description: Current page number
                  totalPages:
                    type: integer
                    description: Total number of pages
        '401':
          description: Unauthorized - User not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - User does not have studio access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Service:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the service
        name:
          type: string
          description: Name of the service
        price:
          type: number
          format: float
          description: Price of the service
        description:
          type: object
          description: Description of the service
        cover_url:
          type: string
          nullable: true
          description: URL to the service cover image
        highlights:
          type: array
          items:
            type: string
          description: List of service highlights
        service_type:
          type: string
          description: Type of service
        status:
          type: string
          enum: [applied, approved, incomplete, disabled, blocked]
          description: Status of the service
        enabled:
          type: boolean
          nullable: true
          description: Whether the service is enabled
        created_at:
          type: string
          format: date-time
          description: Timestamp when the service was created
        created_by:
          type: integer
          description: ID of the studio that created the service
        studios:
          type: object
          properties:
            name:
              type: string
              description: Name of the studio that created the service
        services_category_rel:
          type: array
          items:
            type: object
            properties:
              services_category:
                type: object
                properties:
                  category_name:
                    type: string
                    description: Name of the category
      required:
        - id
        - name
        - price
        - service_type
        - created_at
        - created_by

    Error:
      type: object
      properties:
        message:
          type: string
          description: Error message
        code:
          type: string
          description: Error code
      required:
        - message